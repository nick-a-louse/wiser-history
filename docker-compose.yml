# Lives in /srv/wiser on the server, next to .env. Images are built by GitHub Actions.
services:
  collector:
    image: ghcr.io/nick-a-louse/wiser-history-collector:latest
    container_name: wiser-collector
    restart: unless-stopped
    user: "${PUID:-1003}:${PGID:-1006}"   # PUID/PGID live in .env, like the linuxserver containers
    env_file: .env
    environment:
      DB_PATH: /data/wiser.db
      PUBLISH_DIR: /data/published
    ports:
      - "9109:9109"                       # metrics + /healthz; host port: change if it clashes
    volumes:
      - /opt/appdata/wiser:/data
    logging:
      driver: json-file
      # The predecessor wrote an unbounded log. This one cannot.
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ghcr.io/nick-a-louse/wiser-history-web:latest
    container_name: wiser-web
    restart: unless-stopped
    user: "${PUID:-1003}:${PGID:-1006}"
    ports:
      - "5059:8080"  # host port: change if it clashes
    volumes:
      # Read-only: the site serves the data, it must never be able to alter it.
      - /opt/appdata/wiser/published:/usr/share/nginx/html/published:ro
    # nginx needs somewhere writable for its cache and pid file when it runs as 1003.
    tmpfs:
      - /var/cache/nginx
      - /tmp
    depends_on:
      - collector
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
