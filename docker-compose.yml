services:
  collector:
    build: .
    image: wiser-collector
    container_name: wiser-collector
    restart: unless-stopped
    user: "1009:1009"
    env_file: .env
    environment:
      DB_PATH: /data/wiser.db
      PUBLISH_DIR: /data/published
    ports:
      - "9109:9109"
    volumes:
      - /opt/appdata/wiser:/data
    logging:
      driver: json-file
      # The predecessor wrote an unbounded log. This one cannot.
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ./web
    image: wiser-web
    container_name: wiser-web
    restart: unless-stopped
    ports:
      - "5059:8080"
    volumes:
      # Read-only: the site serves the data, it must never be able to alter it.
      - /opt/appdata/wiser/published:/usr/share/nginx/html/published:ro
    depends_on:
      - collector
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
