server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Data is regenerated every 5 minutes; never let a browser cache serve a
    # stale reading while the freshness indicator claims the page is current.
    location /published/ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # The chart library is version-pinned at build time, so it can cache hard.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # nginx has no built-in type for .webmanifest, so it falls back to
    # application/octet-stream and Chrome ignores the manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires 7d;
    }

    # Icons, fonts and the shared gomez-ui files carry ?v=<version>, so a new
    # release is picked up straight away; plain caching is safe.
    location ~* \.(ico|png|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types application/json application/javascript text/css;
    gzip_min_length 1024;
}
